server {
    listen 80;
    listen [::]:80;
    server_name transfer.wayfold.xyz;

    root /var/www/transfer/current;
    index index.html;

    # Fonts Google + unsafe-inline per progress bar / canvas (stile dinamico via JS)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(self)" always;

    location = /sw.js {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.wasm$ {
        default_type application/wasm;
        try_files $uri =404;
        expires 1y;
    }

    location ~* \.webmanifest$ {
        default_type application/manifest+json;
        try_files $uri =404;
        expires -1;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
